services:
  - type: web
    name: okfans-backend-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TG_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false

  - type: worker
    name: okfans-telegram-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TG_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
